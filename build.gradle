// Top-level build file
buildscript {
    // Repositories are now declared in settings.gradle
    dependencies {
        classpath 'com.android.tools.build:gradle:8.0.0'  // Updated for Java 23 compatibility
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Add Java toolchain configuration to handle Java version compatibility
allprojects {
    tasks.withType(JavaCompile).configureEach {
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
}
