// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Add a task to download the Gradle wrapper JAR
task downloadGradleWrapperJar {
    doLast {
        def wrapperJarPath = "${rootDir}/gradle/wrapper/gradle-wrapper.jar"
        def wrapperJarFile = new File(wrapperJarPath)
        if (!wrapperJarFile.exists()) {
            def wrapperJarUrl = "https://github.com/gradle/gradle/raw/v7.4.2/gradle/wrapper/gradle-wrapper.jar"
            println "Downloading Gradle wrapper JAR from ${wrapperJarUrl}"
            wrapperJarFile.parentFile.mkdirs()
            new URL(wrapperJarUrl).withInputStream { inputStream ->
                wrapperJarFile.withOutputStream { outputStream ->
                    outputStream << inputStream
                }
            }
            println "Downloaded Gradle wrapper JAR to ${wrapperJarPath}"
        }
    }
}

// Make sure the wrapper JAR is downloaded before any Gradle command
tasks.whenTaskAdded { task ->
    if (task.name != 'downloadGradleWrapperJar') {
        task.dependsOn 'downloadGradleWrapperJar'
    }
}
